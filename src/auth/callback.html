<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NULL VOID — Signing in</title>
  <link rel="stylesheet" href="../ui/theme.css">

    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }

    <img src="../icons/icon128.png" alt="" width="64" height="64">
    <h1 id="title">Signing you in…</h1>
    <p class="muted" id="message"><span class="spinner"></span></p>
    <button class="btn" id="close" hidden>Close this tab</button>
  </main>
